name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Instala Gradle 9.6.0 (no hace falta tener gradlew en el repo)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: rodtricks-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
